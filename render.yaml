services:
  - type: web
    name: pazaryeri-ecommerce
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn marketplace_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
